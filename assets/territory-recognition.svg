<svg xmlns="http://www.w3.org/2000/svg" width="960" height="550" viewBox="0 0 960 550" role="img" aria-labelledby="title desc"><title id="title">55% повністю не приймають визнання територій Росії</title><desc id="desc">Наскільки Ви готові прийняти кожен із наступних варіантів як можливу ціну за досягнення миру? Міжнародне визнання Криму та частини Донбасу як територій Росії</desc><rect width="100%" height="100%" fill="#fcfcfb"/><g font-family="&quot;Source Sans 3&quot;, &quot;Trebuchet MS&quot;, sans-serif"><text x="40" y="43" font-size="27" font-weight="600" text-anchor="start" fill="#0b0b0b">55% повністю не приймають визнання територій Росії</text><text x="40" y="78" font-size="17" font-weight="400" text-anchor="start" fill="#52514e">Наскільки Ви готові прийняти кожен із наступних варіантів як можливу ціну за досягнення миру?</text><text x="40" y="106.65" font-size="17" font-weight="400" text-anchor="start" fill="#0b0b0b">Міжнародне визнання Криму та частини Донбасу як територій Росії</text><text x="40" y="136.3" font-size="14" font-weight="400" text-anchor="start" fill="#52514e">NDI / КМІС · 3–28 березня 2026</text><text x="300.0" y="167.3" font-size="13" font-weight="400" text-anchor="middle" fill="#52514e">0%</text><text x="442.5" y="167.3" font-size="13" font-weight="400" text-anchor="middle" fill="#52514e">25%</text><text x="585.0" y="167.3" font-size="13" font-weight="400" text-anchor="middle" fill="#52514e">50%</text><text x="727.5" y="167.3" font-size="13" font-weight="400" text-anchor="middle" fill="#52514e">75%</text><text x="870.0" y="167.3" font-size="13" font-weight="400" text-anchor="middle" fill="#52514e">100%</text><text x="40" y="197.3" font-size="17" font-weight="400" text-anchor="start" fill="#0b0b0b">Повністю не приймаю</text><rect x="300" y="178.3" width="313.5" height="25" fill="#2a78d6"/><text x="623.5" y="197.3" font-size="18" font-weight="600" text-anchor="start" fill="#0b0b0b">55%</text><text x="40" y="249.3" font-size="17" font-weight="400" text-anchor="start" fill="#0b0b0b">Скоріше не приймаю</text><rect x="300" y="230.3" width="79.80000000000001" height="25" fill="#2a78d6"/><text x="389.8" y="249.3" font-size="18" font-weight="600" text-anchor="start" fill="#0b0b0b">14%</text><text x="40" y="301.3" font-size="17" font-weight="400" text-anchor="start" fill="#0b0b0b">Скоріше приймаю</text><rect x="300" y="282.3" width="57.0" height="25" fill="#2a78d6"/><text x="367.0" y="301.3" font-size="18" font-weight="600" text-anchor="start" fill="#0b0b0b">10%</text><text x="40" y="353.3" font-size="17" font-weight="400" text-anchor="start" fill="#0b0b0b">Повністю приймаю</text><rect x="300" y="334.3" width="22.8" height="25" fill="#2a78d6"/><text x="332.8" y="353.3" font-size="18" font-weight="600" text-anchor="start" fill="#0b0b0b">4%</text><text x="40" y="405.3" font-size="17" font-weight="400" text-anchor="start" fill="#0b0b0b">Важко відповісти</text><rect x="300" y="386.3" width="91.2" height="25" fill="#2a78d6"/><text x="401.2" y="405.3" font-size="18" font-weight="600" text-anchor="start" fill="#0b0b0b">16%</text><text x="40" y="461.3" font-size="13" font-weight="400" text-anchor="start" fill="#52514e">Округлені частки всіх опублікованих категорій; питання та опції відтворено дослівно.</text><text x="40" y="486.15000000000003" font-size="13" font-weight="600" text-anchor="start" fill="#0b0b0b">Графік: Valentyn Hatsko, TG: @gorbach_squad.</text><a href="https://www.ndi.org/sites/default/files/2026-07/UKR_NDI-March-2026-Political-Survey_Public.pptx.pdf"><text x="40" y="506.15000000000003" font-size="13" font-weight="400" text-anchor="start" fill="#52514e">Джерело: NDI / КМІС, PDF, с. 21; зібрано у жовтні 2026.</text></a><text x="40" y="526.1500000000001" font-size="13" font-weight="400" text-anchor="start" fill="#52514e">Дані, код і метод: github.com/velgaks/peace-agreement-polls</text></g></svg>
